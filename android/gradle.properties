org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# The build runs on the JDK 21 that the Nix devShell exports via JAVA_HOME
# (not the ambient JDK 25). If Gradle ever picks up the wrong JDK, pin it here:
#   org.gradle.java.home=/nix/store/.../jdk-21
#
# On NixOS, AGP's Maven-downloaded aapt2 won't run; point it at the Nix one:
#   android.aapt2FromMavenOverride=<ANDROID_HOME>/build-tools/36.0.0/aapt2
# This host is Ubuntu (FHS) under WSL2, where the prebuilt aapt2 runs fine, so
# it is left off; add it only if a build fails on aapt2.
