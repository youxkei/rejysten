[versions]
agp = "9.3.0"
kotlin = "2.3.20"                 # also drives org.jetbrains.kotlin.plugin.compose
wearCompose = "1.6.2"            # androidx.wear.compose:* (material3 / foundation / navigation)
composeBom = "2026.06.01"        # pins Compose runtime/ui/foundation -> 1.11.4
androidxActivity = "1.13.0"
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.11.0"
coroutines = "1.11.0"
playServicesWearable = "20.0.1"
wearTiles = "1.6.2"              # androidx.wear.tiles:*
protolayout = "1.4.2"            # androidx.wear.protolayout:* (the tile's layout & expressions)
concurrentFutures = "1.3.0"      # ListenableFuture from a blocking call, for onTileRequest
junit = "4.13.2"
orgJson = "20250107"                # real org.json for JVM unit tests (see below)

# Phone-auth coordinates (mobile module: Credential Manager -> Firebase Auth)
firebaseBom = "34.16.0"          # com.google.firebase:firebase-bom
credentials = "1.6.0"            # androidx.credentials:* (Credential Manager)
googleid = "1.2.0"               # com.google.android.libraries.identity.googleid:googleid
googleServices = "4.5.0"         # com.google.gms.google-services Gradle plugin

[libraries]
# Wear Compose (watch UI)
androidx-wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
androidx-wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
androidx-wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wearCompose" }

# Compose BOM + BOM-managed members (no explicit versions)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

# Core / lifecycle / activity / coroutines
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Data Layer (phone <-> watch token hand-off)
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }

# Tile (the surface reached by swiping from the watch face). Laid out with
# ProtoLayout rather than Compose, and its elapsed time ticks from an expression.
androidx-wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wearTiles" }
androidx-wear-protolayout = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "protolayout" }
androidx-wear-protolayout-material3 = { group = "androidx.wear.protolayout", name = "protolayout-material3", version.ref = "protolayout" }
androidx-wear-protolayout-expression = { group = "androidx.wear.protolayout", name = "protolayout-expression", version.ref = "protolayout" }
# onTileRequest returns a ListenableFuture, and LifeLogClient blocks: this bridges them.
androidx-concurrent-futures = { group = "androidx.concurrent", name = "concurrent-futures", version.ref = "concurrentFutures" }

# JVM unit tests. android.jar stubs org.json with methods that throw, so a unit
# test touching JSON needs a real implementation on the test classpath.
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

# Phone auth (mobile module): Credential Manager mints a Google ID token that is
# exchanged for a Firebase credential; firebase-auth is BOM-managed (no version).
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidxActivity" }
# .await() bridges Play Services Task<T> (FirebaseAuth / getIdToken) to coroutines.
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
